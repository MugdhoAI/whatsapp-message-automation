name: Feature request
description: Suggest a focused improvement to the personal automation workflow.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Requests should support controlled, opt-in communication and must not depend on spam, contact scraping, or bypassing WhatsApp protections.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the real workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Explain what the feature means for confirmation, duplicate sends, message data, and recipient consent.
    validations:
      required: true
