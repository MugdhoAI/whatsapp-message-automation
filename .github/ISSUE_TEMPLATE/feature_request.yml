name: Feature request
description: Suggest an improvement to the tool.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions should support messages that recipients expect. Do not propose spam, contact scraping, or ways to bypass WhatsApp protections.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety
      description: How could this affect confirmation, duplicate sends, message data, or recipient consent?
    validations:
      required: true
