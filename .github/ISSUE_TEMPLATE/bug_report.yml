name: Bug report
description: Report a problem you can reproduce.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real phone numbers, message text, browser profiles, session cookies, or logs that contain private information.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem.
      placeholder: The command exits before opening the chat.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command and a small example with fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      placeholder: Windows 11, Chromium installed by Playwright
    validations:
      required: true
